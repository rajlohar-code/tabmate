<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TabMate</title>
  <script type="module" crossorigin src="/assets/sidepanel.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/sidepanel.css">
</head>
<body>
  <div class="chat-app">
    <!-- Clean Minimalist Header -->
    <header class="chat-header">
      <div class="model-badge" id="model-badge">
        <select id="model-select" class="header-model-select">
          <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
          <option value="gemini-flash-latest">Gemini Flash Latest</option>
          <option value="gemini-2.5-flash-lite">Gemini Flash Lite</option>
        </select>
      </div>

      <div class="header-tools">
        <!-- Discreet sync roller / spinner near + icon -->
        <div class="sync-roller hidden" id="sync-roller" title="Syncing page content...">
          <div class="spinner-ring"></div>
        </div>

        <button id="new-chat-btn" class="header-btn" title="New Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        <button id="settings-btn" class="header-btn" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Messages Viewport -->
    <main class="chat-viewport" id="chat-viewport">
      <!-- Empty State / Welcome Screen -->
      <div class="empty-state" id="empty-state">
        <div class="tabmate-logo">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
            <!-- Modern TabMate Brand Mark: Dual Overlapping Intelligent Tabs -->
            <rect x="6" y="8" width="24" height="24" rx="6" fill="#3B82F6" fill-opacity="0.25" stroke="#60A5FA" stroke-width="1.5"/>
            <rect x="14" y="14" width="24" height="24" rx="6" fill="url(#tab-grad)" stroke="#A78BFA" stroke-width="1.5"/>
            <circle cx="21" cy="23" r="2" fill="#FFFFFF"/>
            <circle cx="28" cy="23" r="2" fill="#FFFFFF"/>
            <path d="M22 28C23 30 27 30 28 28" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
            <defs>
              <linearGradient id="tab-grad" x1="14" y1="14" x2="38" y2="38" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4F46E5"/>
                <stop offset="1" stop-color="#7C3AED"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h2 class="welcome-heading">Ask TabMate anything about this page</h2>

        <div class="suggestion-grid" id="suggestion-grid">
          <button class="suggestion-card" data-prompt="Summarize this page in 3 clear bullet points.">
            <span class="sugg-icon">📄</span>
            <span class="sugg-text">Summarize key points</span>
          </button>
          <button class="suggestion-card" data-prompt="What are the key takeaways and conclusions from this page?">
            <span class="sugg-icon">💡</span>
            <span class="sugg-text">Key takeaways</span>
          </button>
          <button class="suggestion-card" data-prompt="Explain this page simply and clearly in everyday language.">
            <span class="sugg-icon">🧠</span>
            <span class="sugg-text">Explain simply</span>
          </button>
          <button class="suggestion-card" data-prompt="What questions does this page answer? Provide the top 3 Q&As.">
            <span class="sugg-icon">❓</span>
            <span class="sugg-text">Generate Q&A</span>
          </button>
        </div>
      </div>

      <!-- Messages Thread -->
      <div class="messages-thread" id="messages-thread"></div>
    </main>

    <!-- Clean Bottom Chat Input -->
    <footer class="input-panel">
      <form id="chat-form" class="input-box">
        <textarea
          id="user-input"
          class="prompt-textarea"
          placeholder="Ask TabMate about this page..."
          rows="1"
        ></textarea>
        <button type="submit" id="send-btn" class="send-circle-btn" disabled title="Send message">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
      </form>
      <div class="input-disclaimer">
        TabMate can make mistakes. Verify information from the page.
      </div>
    </footer>

    <!-- Minimal Settings Modal -->
    <div class="settings-dialog-backdrop hidden" id="settings-modal">
      <div class="settings-dialog">
        <div class="dialog-header">
          <h3>TabMate Settings</h3>
          <button id="close-settings-btn" class="close-btn">&times;</button>
        </div>
        <div class="dialog-body">
          <div class="field-group">
            <label for="api-key-input">Gemini API Key</label>
            <div class="key-input-row">
              <input type="password" id="api-key-input" placeholder="Paste your Gemini API key" />
              <button type="button" id="toggle-key-visibility" class="ghost-btn">Show</button>
            </div>
            <span class="hint">Free key from <a href="https://aistudio.google.com/" target="_blank">Google AI Studio</a></span>
          </div>

          <div class="settings-feedback" id="settings-status"></div>
        </div>
        <div class="dialog-footer">
          <button id="save-settings-btn" class="save-btn">Save</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
